      /* [Aleph] EL CAMPO, ANTES DEL PRIMER PINTADO. Este par se declara acá —y no sólo en
         los tokens— para que no haya un destello del color equivocado mientras carga el
         CSS. Por eso mismo tiene que seguir a los tokens cuando cambian: eran el blanco
         azulado y el casi-negro azulado del stack (220 20% 98% / 220 20% 5%), y quedaban
         como el ÚNICO rastro de la paleta vieja, en el elemento más grande de la página.
         Ahora son los de `aleph-tokens.css`: #F4F4F5 y #0B0B0C. */
      html { background-color: hsl(240 5% 96%); }
      html.dark { background-color: hsl(240 4% 5%); }
