  <rect width="32" height="32" rx="7.5" fill="#0B0B0C"/>
  <line x1="9.5" y1="14" x2="9.5" y2="24.5" stroke="#8D8BEE" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="7.5" y="16" width="4" height="6" rx="1" fill="#8D8BEE"/>
  <line x1="16" y1="9.5" x2="16" y2="21.5" stroke="#8D8BEE" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="14" y="11.5" width="4" height="7" rx="1" fill="#8D8BEE"/>
  <line x1="22.5" y1="5.5" x2="22.5" y2="18" stroke="#8D8BEE" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="20.5" y="7.5" width="4" height="7.5" rx="1" fill="#8D8BEE"/>
</svg>
