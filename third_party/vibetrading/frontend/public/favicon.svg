<!-- [Gate 4 · F6 · Finanzas · inmersión 3.8] Las tres velas son el OFICIO y se conservan; la
     placa naranja con el degradé de marca del proyecto de origen, no. El fondo pasa al campo
     de Aleph (#0B0B0C) y las velas al acento de la casa (#8D8BEE), que es como se ven todos
     los glifos del sistema. -->
