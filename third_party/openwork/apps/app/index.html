<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aleph Oficina</title>

    <link rel="icon" type="image/svg+xml" href="/openwork-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- [un solo picker en las siete · 2026-08-22] El cerebro se elige en el picker de
         Aleph, uno para las siete superficies. El de este stack no se saca: se vuelve
         puerta. Fuera de Aleph este archivo es un no-op (LEY 0).
         Ver public/aleph-picker-unico.js. -->
    <script src="/aleph-picker-unico.js"></script>
    <!-- [Aleph · rediseño fase 1 · cable (b)] EL INTERRUPTOR DE LA PIEL. La hoja viaja
         siempre; sólo se aplica con `?aleph_piel=v2` en la URL del iframe. Apagar el
         rediseño no cuesta un build. Fuera de Aleph es un no-op (LEY 0).
         Ver public/aleph-piel.js. -->
    <script src="/aleph-piel.js"></script>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("openwork.themePref") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = mode === "dark" || (mode === "system" && prefersDark) ? "dark" : "light";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body class="bg-dls-surface text-dls-text mac:bg-transparent">
    <div id="root"></div>
    <script type="module" src="/src/index.react.tsx"></script>
  </body>
</html>
