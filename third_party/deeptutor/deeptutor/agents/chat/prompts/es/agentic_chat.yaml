  empty_reply: "(respuesta vacía)"
  skipped_reply: "(omitido)"
  question_fallback: "(pregunta)"
  user_answered: "Respuesta del usuario:"
  no_tool_traces: "No se llamó ninguna herramienta en este turno."
  no_intermediate_trace: "No se proporcionó ningún registro intermedio de ejecución."
