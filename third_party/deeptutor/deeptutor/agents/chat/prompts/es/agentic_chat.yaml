  start_retrieval: "Iniciando recuperación de información"
  empty_tool_result: "La herramienta terminó sin devolver texto."
  loop_budget_exhausted: "Se alcanzó el límite de exploración; respondiendo con la información obtenida."
  loop_settlement: "Se alcanzó el límite de exploración; completando los pasos necesarios antes de responder."
