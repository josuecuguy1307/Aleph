[package]
name = "app"
version = "0.1.2"
description = "A Tauri App"
authors = ["you"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# Sólo para `kill(pid, SIGTERM)` al cerrar: `Child::kill()` de std ES SIGKILL, y con
# SIGKILL el bootloader de PyInstaller no alcanza a borrar su _MEI de 214 MB (medido).
# Ya venía en el Cargo.lock como transitiva de tauri (0.2.189) — no agrega descarga.
libc = "0.2"
base64 = "0.22"
# Ya está fijado transitivamente en Cargo.lock; se usa directo para la capability
# efímera que une esta webview con SU sidecar y frena DNS rebinding.
getrandom = "0.2"

# [4.5 · endurecimiento] strip de símbolos del binario release (menos superficie de
# ingeniería inversa + menos tamaño). El anti-copia grueso (WASM + firma) es aparte.
[profile.release]
strip = true
